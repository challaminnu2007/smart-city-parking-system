{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1.5rem;">
    <div style="font-size: 5rem; color: var(--accent-rose); margin-bottom: 1rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">500 - Server Error</h1>
    <p style="color: var(--text-secondary); max-width: 520px; margin: 0 auto 2rem; font-size: 1.05rem;">
        An unexpected error occurred while processing your request. Any pending database transactions were rolled back safely.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}

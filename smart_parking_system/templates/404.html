{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1.5rem;">
    <div style="font-size: 5rem; color: var(--primary); margin-bottom: 1rem;">
        <i class="fa-solid fa-location-crosshairs"></i>
    </div>
    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">404 - Page Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 520px; margin: 0 auto 2rem; font-size: 1.05rem;">
        The parking route or page you are searching for does not exist or may have been relocated.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Return Home
        </a>
        <a href="{{ url_for('parking.slots_page') }}" class="btn btn-outline">
            <i class="fa-solid fa-car"></i> View Parking Slots
        </a>
    </div>
</div>
{% endblock %}
